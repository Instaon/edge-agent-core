[package]
name = "edge-agent-core"
version = "0.1.0"
edition = "2024"
description = "Minimal deterministic agent runtime kernel for edge devices"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
semver = "1"
wasmtime = { version = "29", default-features = false, features = ["cranelift", "runtime"] }
ureq = { version = "2", features = ["json"] }
base64 = "0.22"

[[bin]]
name = "edge-agent"
path = "src/main.rs"

[[bin]]
name = "ea-pack"
path = "src/bin/ea_pack.rs"

[workspace]
members = ["."]
exclude = ["examples/plugins/strategy-demo"]
